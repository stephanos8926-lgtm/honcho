# Honcho single-container deployment — RapidWebs (2026-08)
#
# This compose reflects how Honcho actually runs on infra:
#   - host network (no compose internal DNS)
#   - config.toml bind-mounted from host (NOT .env file)
#   - RW InferenceEngine on same host (127.0.0.1:8300)
#   - pgvector:pg15 database
#   - Deriver in-process, flush-enabled
#   - Dream: ["omni", "card_refresh"] (peer cards auto-refresh)
#   - KG migration included (kg_001 rebased onto head)
#
# Usage:
#   cp config.toml.example config.toml
#   # Edit config.toml — REQUIRED: OPENROUTER_API_KEY, RW IE base_url
#   docker compose -f deploy/docker-compose.single-container.yml up -d
#   # Verify: curl http://localhost:8000/health
#
# ⚠️  The config.toml bind mount MUST be a file on the host, not a compose env-file.
#     See deploy/setup.sh for the idempotent provisioning path.

services:
  honcho-api:
    build:
      context: ..
      dockerfile: Dockerfile
    entrypoint: ["sh", "docker/entrypoint.sh"]
    network_mode: host
    # config.toml is bind-mounted from the host file system
    # volumes: ["${HONCHO_CONFIG_SRC:-/tmp/honcho_config.toml}:/app/config.toml:ro"]
    env_file:
      - .env
    environment:
      # ── RapidWebs Runtime Configuration ──────────────────────────────
      # Single-container mode: API + Deriver run in one process
      DERIVER_IN_PROCESS_MODE: "true"
      # Embedding via local RW InferenceEngine (384-dim, OpenAI-compatible)
      EMBEDDING_MODEL_CONFIG__TRANSPORT: "rw_inference"
      EMBEDDING_MODEL_CONFIG__MODEL: "bge-small-en-v1.5"
      EMBEDDING_MODEL_CONFIG__OVERRIDES__BASE_URL: "http://127.0.0.1:8300/v1"
      EMBEDDING_VECTOR_DIMENSIONS: "384"
      # Deriver: flush immediately (no batch threshold)
      DERIVER_FLUSH_ENABLED: "true"
      # Enable all memory features
      PEER_CARD_ENABLED: "true"
      DREAM_ENABLED: "true"
      DREAM_ENABLED_TYPES: '["omni", "card_refresh"]'
      SUMMARY_ENABLED: "true"
      EMBED_MESSAGES: "true"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2).read()"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    restart: unless-stopped
    stop_grace_period: 10s

  honcho-db:
    image: pgvector/pgvector:pg15
    network_mode: host
    environment:
      POSTGRES_DB: honcho
      POSTGRES_PASSWORD: honcho
      POSTGRES_USER: honcho
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U honcho -d honcho"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - honcho-pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  honcho-pgdata: